name = "agriman"
main = "./src/worker.js"
compatibility_date = "2024-11-12"
account_id = "33b8081b03d586f1045d8f49d71d5dff"

[vars]
# Production sender (requires mail.agribak.com Verified in Resend → Domains + DNS).
EMAIL_FROM = "AgriMan <noreply@mail.agribak.com>"
EMAIL_FROM_FALLBACK = "AgriMan <onboarding@resend.dev>"
# Optional: set to your Gmail while testing before domain is verified (remove when live):
# EMAIL_TEST_TO = "mhmd.manaysah@gmail.com"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "agriman-db"
database_id = "570a6705-799b-4807-8ec0-c598509bcd09"
